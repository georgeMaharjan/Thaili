apply plugin: 'com.android.application'

// Separate package and outputs for synthetic phone tests; never replaces the user's ledger.
def syntheticDeviceApp = project.hasProperty("syntheticDeviceApp")
if (syntheticDeviceApp) layout.buildDirectory.set(file("build/synthetic-device"))

android {
    namespace = "com.george.thaili"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId syntheticDeviceApp ? "com.george.thaili.devicetest" : "com.george.thaili"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.4.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (syntheticDeviceApp) sourceSets.release.manifest.srcFile("src/syntheticDevice/AndroidManifest.xml")

    // Opt in when testing an installed, signed release without replacing it with a debug build.
    testBuildType = project.findProperty("deviceTestBuildType") ?: "debug"

    // Release signing is optional: put storeFile/storePassword/keyAlias/keyPassword in android/keystore.properties (git-ignored).
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        def keystore = new Properties()
        keystoreFile.withInputStream { keystore.load(it) }
        signingConfigs {
            release {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.biometric:biometric:1.1.0" // app lock + delete confirmation (ThailiPlugin.authenticate)
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
